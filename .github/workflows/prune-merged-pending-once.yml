name: One-time verified pending branch cleanup
on:
  push:
    branches: [codex/dev]
    paths: ['.github/workflows/prune-merged-pending-once.yml']

permissions:
  contents: read

jobs:
  prune:
    if: github.repository == 'jinze909/rpg' && github.ref == 'refs/heads/codex/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: one-time-verified-pending-cleanup
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Audit and remove only SHA-pinned, merged, inactive refs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.error, urllib.parse, urllib.request
          
          REPO = "jinze909/rpg"
          TOKEN = os.environ["GH_TOKEN"]
          ALLOWED = {
                        "codex/pending/m1-urp2d-current-dev": "3a3465225636212effcb1d452deb6d7802bb0d16",
                        "codex/pending/m2-new-input-system": "81a6fe97e347aff20cb2d7bc1135b5082b4f098e",
                        "codex/pending/m2-ugui-focus-integrated": "e0dd7cc23cbeef60b55076f154fd93a9a79e9f92",
                        "codex/pending/m3-cinemachine3": "ca3652f5c234e2746939c4995aed38850759ea56",
                        "codex/pending/m4-2d-animation": "f34a1805586c806ecd759cffda1de97d3653ffb2",
                        "codex/pending/m5-tilemap-extras": "44f37f426892c32ef381f6aa102e383c8f273f61",
                        "codex/pending/m6-audio-mixer": "7c5bb4a0efe610085661670da6789fecea6be3bc",
                        "codex/pending/m7-sprite-atlas-v2": "01d7dda6237acf3845487e93a08f708d94141ba0",
                        "codex/pending/m8-pixel-perfect": "aa6f99a135df27c4cf65631f0e5708140d4ad62a",
                        "codex/pending/m9-localization-after-m8": "991c7f9d941aea14749b97f04a96ca377a60fac6",
                        "codex/pending/m10-memory-profiler": "d913c2d5e4ac25a8af934b7884cbba62d01b3128",
                        "codex/pending/m11-build-profiles": "12a94ed08bb361c7864888ef1dac7847a5827935",
                        "codex/pending/story-003-direct-combat-v2": "2eee996adaec6563fd379416e7ec6fad8e1b9a62",
                        "codex/pending/story-003-follower-walk-after-pixel-leader": "ce5790edc734d3399dfc240c70b3258cbddeb035",
                        "codex/pending/story-003-ork-action-contract-integrated": "c8be4013acbc10b4e29b12a5b67ebde618e8dc32",
                        "codex/pending/story-003-ork-ui-foundation-m11": "8eb77622a07c582ff87e06b50f96994e4cd19a29",
                        "codex/pending/story-003-pixel-beast-facing-integrated": "8d78f5865fe3c7a15a263a0f34af19f003bc47bd",
                        "codex/pending/story-003-pixel-leader-beast": "04df110a6227c1a81b216a71b68a4a2605104962",
                        "codex/pending/story-003-pixel-leader-walk": "285177dff01996e37b2cfea4c5899c25e0e869b3",
                        "codex/pending/story-003-pixel-rescuers": "03718569c14b0627fc4e57c3deb623972d52fbe8",
                        "codex/pending/story-003-retreat-after-m9": "ed72afeec835bb0f9b06b7c7b5c42db2b3b602fa",
          }
          ACTIVE = {"queued", "in_progress", "waiting", "requested", "pending"}
          HEADERS = {"Authorization": "Bearer " + TOKEN, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def get(path):
              req = urllib.request.Request("https://api.github.com" + path, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=25) as rsp:
                  return json.load(rsp)
          def get_all(path):
              out = []
              for page in range(1, 12):
                  data = get(path + ("&" if "?" in path else "?") + "page=" + str(page))
                  entries = data["workflow_runs"] if isinstance(data, dict) and "workflow_runs" in data else data
                  out += entries
                  if len(entries) < 100:
                      return out
              raise RuntimeError("More than 1000 entries; refusing deletion")
          def git(*args):
              return subprocess.run(["git", *args], check=False, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          def stop(message):
              raise RuntimeError("Safety gate failed: " + message)
          if os.environ.get("GITHUB_REF") != "refs/heads/codex/dev":
              stop("Unexpected source ref")
          if os.environ.get("GITHUB_REPOSITORY") != REPO:
              stop("Unexpected repository")
          if len(ALLOWED) != 21 or any(not n.startswith("codex/pending/") for n in ALLOWED):
              stop("Unexpected allowlist")
          branches = {x["name"]:x for x in get_all("/repos/" + REPO + "/branches?per_page=100")}
          open_prs = get_all("/repos/" + REPO + "/pulls?state=open&per_page=100")
          pr_heads = {x["head"]["ref"] for x in open_prs}
          active_runs = []
          for state in sorted(ACTIVE):
              active_runs.extend(get_all("/repos/" + REPO + "/actions/runs?per_page=100&status=" + state))
          active_branches = {x.get("head_branch") for x in active_runs}
          fetch = git("fetch", "--no-tags", "origin", "+refs/heads/*:refs/remotes/origin/*")
          if fetch.returncode: stop("Failed to fetch live refs: " + fetch.stderr[-500:])
          live_dev = get("/repos/" + REPO + "/git/ref/heads/codex/dev")["object"]["sha"]
          if git("rev-parse", "refs/remotes/origin/codex/dev").stdout.strip() != live_dev:
              stop("GitHub and locally fetched dev SHA differ")
          print("AUDIT: dev=" + live_dev + " ; allowlisted=" + str(len(ALLOWED)) + " ; open_PRs=" + str(len(open_prs)) + " ; active_runs=" + str(len(active_runs)), flush=True)
          deleted, skipped = [], []
          for branch, expected in sorted(ALLOWED.items()):
              reason = None
              info = branches.get(branch)
              if info is None: reason = "branch missing"
              elif info["commit"]["sha"] != expected: reason = "HEAD moved"
              elif info.get("protected"): reason = "protected"
              elif branch in pr_heads: reason = "open PR"
              elif branch in active_branches: reason = "active workflow"
              elif git("merge-base", "--is-ancestor", expected, live_dev).returncode != 0: reason = "not ancestor of dev"
              if reason is None:
                  # Check the branch's current workflow history again, in addition to the
                  # global active-state scan. Unknown API status blocks deletion.
                  latest = get("/repos/" + REPO + "/actions/runs?per_page=100&branch=" + urllib.parse.quote(branch, safe=""))
                  if any(x.get("status") in ACTIVE or x.get("status") not in {"completed"} for x in latest.get("workflow_runs", [])):
                      reason = "branch CI still active"
              if reason is None:
                  current = get("/repos/" + REPO + "/branches/" + urllib.parse.quote(branch, safe=""))
                  if current["commit"]["sha"] != expected or current.get("protected"):
                      reason = "HEAD changed or now protected"
              if reason is None:
                  remote = git("ls-remote", "--heads", "origin", "refs/heads/" + branch)
                  lines = remote.stdout.strip().splitlines()
                  if remote.returncode or len(lines) != 1 or lines[0].split()[0] != expected:
                      reason = "remote SHA differs"
              if reason is not None:
                  skipped.append((branch, reason))
                  print("SKIP " + branch + ": " + reason, flush=True)
                  continue
              # Lease protects against replacing a remote ref after the SHA recheck.
              delete = git("push", "--force-with-lease=refs/heads/" + branch + ":" + expected, "origin", "--delete", "refs/heads/" + branch)
              if delete.returncode:
                  skipped.append((branch, "guarded deletion rejected: " + delete.stderr[-180:].replace("\n"," ")))
                  print("SKIP " + branch + ": guarded deletion rejected", flush=True)
                  continue
              confirm = git("ls-remote", "--heads", "origin", "refs/heads/" + branch)
              if confirm.returncode or confirm.stdout.strip():
                  stop("Deletion could not be verified for " + branch)
              deleted.append((branch, expected))
              print("DELETED " + branch + " at " + expected, flush=True)
          summary = ("# One-off verified candidate cleanup\n"
                     + "Live dev: `" + live_dev + "`\n\n"
                     + "Deleted: **" + str(len(deleted)) + "** / 21 SHA-pinned, dev-ancestor candidates.\n"
                     + "Skipped: **" + str(len(skipped)) + "**.\n\n"
                     + "No diverged candidates were in the deletion allowlist.\n")
          if skipped:
              summary += "\n## Skipped\n" + "\n".join("- `" + b + "`: " + reason for b,reason in skipped) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary)
          print("SUMMARY: deleted=" + str(len(deleted)) + " skipped=" + str(len(skipped)), flush=True)
          
          PY
