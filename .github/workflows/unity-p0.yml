name: Unity ORK P0

on:
  push:
    branches: [codex/dev, codex/pending/ork-bootstrap]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'production/ci/**'
      - 'tools/collect_unity_p0.py'
      - 'tools/restore_unity_p0.py'
      - '.github/workflows/unity-p0*.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'prepare creates a reviewable candidate; verify requires saved configuration'
        type: choice
        options: [verify, prepare]
        default: verify

permissions:
  contents: read

concurrency:
  group: unity-ork-p0
  cancel-in-progress: false

jobs:
  bootstrap:
    uses: ./.github/workflows/unity-p0-editor.yml
    with:
      revision: ${{ github.sha }}
      mode: ${{ inputs.mode || '' }}
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}

  publish:
    needs: bootstrap
    # A prepare-only push can defer the generated commit to an explicit rerun.
    if: >-
      github.ref == 'refs/heads/codex/pending/ork-bootstrap'
      && needs.bootstrap.outputs.mode == 'prepare'
      && (github.run_attempt > 1 || !contains(github.event.head_commit.message, '[p0 prepare only]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate_sha: ${{ steps.publish.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unity-ork-p0-prepare-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/p0
      - name: Save the generated Unity configuration to the candidate branch
        id: publish
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          python3 tools/restore_unity_p0.py artifacts/p0
          python3 tools/verify_ork.py
          git add -- Assets Packages ProjectSettings production/ci/p0-mode.txt
          git diff --cached --stat
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(unity): save the generated ORK bootstrap configuration'
          candidate_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:$GITHUB_REF"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$candidate_sha"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "Saved Unity candidate: $candidate_sha" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: publish
    uses: ./.github/workflows/unity-p0-editor.yml
    with:
      revision: ${{ needs.publish.outputs.candidate_sha }}
      mode: verify
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
