          def verified_archived_proof(name,sha):
              entry=ARCHIVED[name]
              check(sha==entry["head"],"historical branch moved since audit")
              # For this reviewed retirement set, independently prove the original
              # branch was itself green, not only that the replacement is green.
              if entry.get("original_run"):
                  original=api("/repos/"+REPO+"/actions/runs/"+str(entry["original_run"]))
                  check(original.get("head_sha")==sha and
                        original.get("name")=="Unity ORK P0" and
                        original.get("status")=="completed" and
                        original.get("conclusion")=="success",
                        "original SHA lacks successful Unity verification")
                  original_artifacts=pages("/repos/"+REPO+"/actions/runs/"+
                        str(entry["original_run"])+"/artifacts","artifacts",limit=200)
                  original_want="unity-ork-p0-verify-"+sha+"-attempt-"+str(
                        original.get("run_attempt"))
                  check(any(a.get("name")==original_want and
                        a.get("expired") is False and a.get("size_in_bytes",0)>0
                        for a in original_artifacts),
                        "original candidate exact-SHA artifact missing")
              if entry.get("workflow_only"):
                  # Workflow-only history is verified by its own successful
                  # cleanup run; it must never impersonate Unity acceptance.
                  check(ancestor(sha,dev),"workflow-only branch not integrated")
                  changed=git("diff-tree","--no-commit-id","--name-only","-r",sha).splitlines()
                  check(changed==[".github/workflows/close-merged-pending.yml"],
                        "non-workflow files changed")
                  proof=api("/repos/"+REPO+"/actions/runs/"+str(entry["run"]))
                  check(proof.get("head_sha")==sha and
                        proof.get("status")=="completed" and
                        proof.get("conclusion")=="success" and
                        proof.get("name")=="Close fully delivered pending branches",
                        "workflow-only SHA not proven by exact cleanup run")
                  return proof["html_url"]
              check(ancestor("ffc39f9fe1bea122774fd8a54e889083ab78e0e7",dev),
                    "audited dev baseline is missing")
              if entry["ancestor"]:
                  check(ancestor(entry["verified"],dev),"replacement commit not merged")
              else:
                  check(ancestor("8e9f7643ff147ef6f26419733c27ecaab38de207",dev),
                        "evidence workflow integration is missing")
              snapshot=entry["verified"] if entry.get("pin_verified_snapshot") else dev
              for file_path,want in entry["blobs"].items():
                  check(git("rev-parse",snapshot+":"+file_path)==want,
                        "audited replacement changed: "+file_path)
              proof=api("/repos/"+REPO+"/actions/runs/"+str(entry["run"]))
              check(proof.get("head_sha")==entry["verified"] and
