name: Close verified merged pending branches

on:
  push:
    branches: [codex/dev]

permissions:
  contents: read

concurrency:
  group: close-verified-codex-pending
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'jinze909/rpg'
      && github.ref == 'refs/heads/codex/dev'
      && !github.event.forced
      && !github.event.created
      && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Audit historical merged pending HEADs with same-SHA Unity evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.parse, urllib.request
          REPO="jinze909/rpg"
          REF="refs/heads/codex/dev"
          SHARE=re.compile(r"^[0-9a-f]{40}$")
          PENDING=re.compile(r"^codex/pending/[A-Za-z0-9._/-]+$")
          TOKEN=os.environ["GH_TOKEN"]
          HEADERS={"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          
          def check(ok,reason):
              if not ok: raise RuntimeError("SAFETY STOP: "+reason)
          def git(*args):
              proc=subprocess.run(["git",*args],capture_output=True,text=True)
              check(proc.returncode==0,"git "+args[0]+": "+proc.stderr[-240:])
              return proc.stdout.strip()
          def ancestor(a,b):
              p=subprocess.run(["git","merge-base","--is-ancestor",a,b],capture_output=True,text=True)
              check(p.returncode in (0,1),"unknown ancestry: "+p.stderr[-240:])
              return p.returncode==0
          def api(path):
              check(path.startswith("/repos/"+REPO+"/"),"invalid API route")
              q=urllib.request.Request("https://api.github.com"+path,headers=HEADERS)
              with urllib.request.urlopen(q,timeout=30) as response:
                  return json.load(response)
          def pages(path,key=None,limit=500):
              items=[]
              for n in range(1,limit//100+2):
                  sep="&" if "?" in path else "?"
                  response=api(path+sep+"per_page=100&page="+str(n))
                  batch=response[key] if key else response
                  check(isinstance(batch,list),"invalid API page")
                  items+=batch
                  check(len(items)<=limit,"API page limit reached")
                  if len(batch)<100:return items
              raise RuntimeError("API page limit exceeded")
          def runs_for(name):
              runs=pages("/repos/"+REPO+"/actions/runs?branch="+urllib.parse.quote(name,safe=""),
                         "workflow_runs")
              check(all(r.get("status")=="completed" for r in runs),"active or queued CI")
              return runs
          def verify_run(name,sha):
              runs=runs_for(name)
              for r in runs:
                  if r.get("name")!="Unity ORK P0" or r.get("conclusion")!="success":continue
                  attempt=r.get("run_attempt")
                  want="unity-ork-p0-verify-"+sha+"-attempt-"+str(attempt)
                  artifacts=pages("/repos/"+REPO+"/actions/runs/"+str(r["id"])+"/artifacts",
                                  "artifacts",limit=200)
                  if not any(a.get("name")==want and a.get("expired") is False and
                             a.get("size_in_bytes",0)>0 for a in artifacts):continue
                  # A later failed run of this exact SHA invalidates the old green result.
                  stamp=r.get("created_at","")
                  if any(x.get("name")=="Unity ORK P0" and x.get("head_sha")==sha and
                         x.get("created_at","")>stamp and x.get("conclusion")!="success"
                         for x in runs):return None
                  return r.get("html_url")
              return None
          check(os.environ.get("GITHUB_REPOSITORY")==REPO,"wrong repository")
          check(os.environ.get("GITHUB_REF")==REF,"wrong branch")
          with open(os.environ["GITHUB_EVENT_PATH"],encoding="utf-8") as f:event=json.load(f)
          check(event.get("ref")==REF and event.get("forced") is False and
                event.get("created") is False and event.get("deleted") is False,
                "not an ordinary dev update")
          before,after=event.get("before"),event.get("after")
          check(isinstance(before,str) and isinstance(after,str) and
                SHARE.fullmatch(before) and SHARE.fullmatch(after) and
                before!="0"*40 and before!=after,"invalid push history")
          git("fetch","--no-tags","origin","+refs/heads/*:refs/remotes/origin/*")
          dev=api("/repos/"+REPO+"/git/ref/heads/codex/dev")["object"]["sha"]
          check(git("rev-parse","refs/remotes/origin/codex/dev")==dev,
                "dev changed while fetching")
          check(ancestor(before,after) and ancestor(after,dev),
                "force update, missing baseline, or stale event")
          pr_heads={p["head"]["ref"] for p in pages("/repos/"+REPO+"/pulls?state=open")}
          branches=pages("/repos/"+REPO+"/branches",limit=1000)
          # Explicit one-time retirements stay SHA-pinned. Ordinary merged
          # historical heads require their own exact-SHA verify evidence.
          ARCHIVED={
              "codex/pending/story-003-battle-victory-v2": {
                  "head":"dcd7351b3461c78aa8957c2c9c19cd017c50ebd2",
                  "verified":"95d90e3548a599d388def4b6ce72d06f32a8cde8",
                  "run":43111500532,
                  "ancestor":True,
                  "blobs":{
                      "Assets/Game/Soundwell/SoundwellOrkParty.cs":
                          "b36d48efdf6616bf5dc1f0c7f4ab0bdfd70f0af7",
                      "Assets/Game/Tests/Editor/SoundwellOrkBattleTests.cs":
                          "e75ec9dac66c9766e543f6c88f63d07817a11564",
                  },
              },
              "codex/pending/ci-exact-sha-evidence-reuse-recovered-nov11": {
                  "head":"f503c588fcd58229020bb7b6e1aadd8d37366893",
                  "verified":"f503c588fcd58229020bb7b6e1aadd8d37366893",
                  "run":43112019720,
                  "ancestor":False,
                  "blobs":{
                      ".github/workflows/unity-p0.yml":
                          "7784f58fdd3d62c58cbdd63fc2045ff9b9276433",
                      "tools/reuse_unity_evidence.py":
                          "e347f976fbaa7b3a2d362dadb5026d458b814039",
                      "tools/test_reuse_unity_evidence.py":
                          "e62b29221efe1682b2940f861016a2707b8a98eb",
                  },
              },
          }
          def verified_archived_proof(name,sha):
              entry=ARCHIVED[name]
              check(sha==entry["head"],"historical branch moved since audit")
              check(ancestor("ffc39f9fe1bea122774fd8a54e889083ab78e0e7",dev),
                    "audited dev baseline is missing")
              if entry["ancestor"]:
                  check(ancestor(entry["verified"],dev),"replacement commit not merged")
              else:
                  check(ancestor("8e9f7643ff147ef6f26419733c27ecaab38de207",dev),
                        "evidence workflow integration is missing")
              for file_path,want in entry["blobs"].items():
                  check(git("rev-parse",dev+":"+file_path)==want,
                        "audited replacement changed: "+file_path)
              proof=api("/repos/"+REPO+"/actions/runs/"+str(entry["run"]))
              check(proof.get("head_sha")==entry["verified"] and
                    proof.get("status")=="completed" and
                    proof.get("conclusion")=="success" and
                    proof.get("name")=="Unity ORK P0",
                    "replacement SHA lacks verified Unity CI")
              artifacts=pages("/repos/"+REPO+"/actions/runs/"+
                              str(entry["run"])+"/artifacts","artifacts",limit=200)
              want="unity-ork-p0-verify-"+entry["verified"]+"-attempt-"+str(
                  proof.get("run_attempt"))
              check(any(a.get("name")==want and a.get("expired") is False and
                        a.get("size_in_bytes",0)>0 for a in artifacts),
                    "replacement verify evidence missing or expired")
              return proof["html_url"]
          merged_seen=0
          newly_merged=0
          historical_seen=0
          diverged_skipped=0
          deleted=[]
          kept=[]
          for b in branches:
              name=b.get("name","")
              sha=b.get("commit",{}).get("sha","")
              if not PENDING.fullmatch(name):continue
              check(bool(SHARE.fullmatch(sha)),"bad candidate SHA")
              # A preexisting ancestor of dev is just as merged as a newly
              # included one. Diverged/cherry-picked refs are NOT assumed
              # merged; their unique work must be audited separately.
              merged=ancestor(sha,dev)
              historical=name in ARCHIVED
              if not merged and not historical:
                  diverged_skipped+=1
                  continue
              if merged:
                  merged_seen+=1
                  if not ancestor(sha,before):newly_merged+=1
              if historical:historical_seen+=1
              try:
                  check(not b.get("protected"),"protected branch")
                  check(name not in pr_heads,"open PR")
                  check(git("rev-parse","refs/remotes/origin/"+name)==sha,
                        "local HEAD changed")
                  proof=(verified_archived_proof(name,sha) if historical
                         else verify_run(name,sha))
                  check(proof,"no exact-SHA successful Unity verify artifact")
                  check(api("/repos/"+REPO+"/git/ref/heads/codex/dev")["object"]["sha"]==dev,
                        "dev moved")
                  check(name not in {p["head"]["ref"] for p in
                                     pages("/repos/"+REPO+"/pulls?state=open")},
                        "new open PR")
                  fresh=api("/repos/"+REPO+"/branches/"+urllib.parse.quote(name,safe=""))
                  check(fresh["commit"]["sha"]==sha and not fresh.get("protected"),
                        "remote HEAD changed or protected")
                  runs_for(name)
                  ref="refs/heads/"+name
                  lines=git("ls-remote","--heads","origin",ref).splitlines()
                  check(len(lines)==1 and lines[0].split()[0]==sha,
                        "compare-and-swap precondition failed")
                  git("push","--force-with-lease="+ref+":"+sha,
                      "origin","--delete",ref)
                  check(not git("ls-remote","--heads","origin",ref),
                        "deletion not confirmed")
                  deleted.append((name,sha,proof))
                  print("DELETED "+name+" at "+sha+" verified "+proof,flush=True)
              except (RuntimeError,ValueError,KeyError,OSError) as err:
                  kept.append((name,str(err)))
                  print("RETAIN "+name+" : "+str(err),flush=True)
          print("SUMMARY merged_seen="+str(merged_seen)+
                " newly_merged="+str(newly_merged)+
                " historical_audited="+str(historical_seen)+
                " diverged_skipped="+str(diverged_skipped)+
                " deleted="+str(len(deleted))+
                " kept="+str(len(kept)),flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("## Verified merged pending branch cleanup\n\n")
              out.write("Event "+before[:12]+".."+after[:12]+
                        "; merged heads "+str(merged_seen)+
                        " (new "+str(newly_merged)+")"+
                        "; unmerged/diverged skipped "+str(diverged_skipped)+
                        "; deleted "+str(len(deleted))+
                        "; retained "+str(len(kept))+".\n\n")
              for name,sha,proof in deleted:
                  out.write("- Deleted "+name+" at "+sha+"; verify "+proof+"\n")
              for name,why in kept:
                  out.write("- Retained "+name+": "+why+"\n")
              if not merged_seen and not historical_seen:out.write("No merged pending head eligible for audit.\n")
          PY
