name: Close fully delivered pending branches

on:
  push:
    branches: [codex/dev]

permissions:
  contents: read

concurrency:
  group: close-verified-codex-pending
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'jinze909/rpg'
      && github.ref == 'refs/heads/codex/dev'
      && !github.event.forced
      && !github.event.created
      && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Test pending branch cleanup
        run: python3 -m unittest discover -s tools -p test_close_merged_pending.py
      - name: Audit ancestor and SHA-equivalent snapshots before safe deletion
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/close_merged_pending.py
