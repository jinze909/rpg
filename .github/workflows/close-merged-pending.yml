                  proof.get("run_attempt"))
              check(any(a.get("name")==want and a.get("expired") is False and
                        a.get("size_in_bytes",0)>0 for a in artifacts),
                    "replacement verify evidence missing or expired")
              return proof["html_url"]
          merged_seen=0
          newly_merged=0
          historical_seen=0
          diverged_seen=0
          descendant_proven=0
          snapshot_proven=0
          deleted=[]
          kept=[]
          for diverged,name,b in candidates:
              sha=b["commit"]["sha"]
              merged=not diverged
              historical=name in ARCHIVED
              if merged:
                  merged_seen+=1
                  if not ancestor(sha,before):newly_merged+=1
              else:diverged_seen+=1
              if historical:historical_seen+=1
              try:
                  check(not b.get("protected"),"protected branch")
                  check(name not in pr_heads,"open PR")
                  check(git("rev-parse","refs/remotes/origin/"+name)==sha,
                        "local HEAD changed")
                  # Never delete a branch with any CI still queued or running,
                  # even when other branches contain an identical snapshot.
                  branch_runs=runs_for(name)
                  if historical:
                      proof=verified_archived_proof(name,sha)
                      method="SHA-pinned audited replacement"
                  elif merged:
                      proof=verify_run(name,sha,branch_runs)
                      method="exact candidate SHA"
                      if not proof:
                          proof=descendant_proof(sha)
                          method="verified descendant in dev history"
                          if proof:descendant_proven+=1
                  else:
                      proof=snapshot_proof(sha)
                      method="exact changed-file snapshot in verified dev history"
                      if proof:snapshot_proven+=1
                  check(proof,"no validated ancestor or exact snapshot replacement")
                  check(api("/repos/"+REPO+"/git/ref/heads/codex/dev")["object"]["sha"]==dev,
                        "dev moved")
                  check(name not in {p["head"]["ref"] for p in
                                     pages("/repos/"+REPO+"/pulls?state=open")},
                        "new open PR")
                  fresh=api("/repos/"+REPO+"/branches/"+urllib.parse.quote(name,safe=""))
                  check(fresh["commit"]["sha"]==sha and not fresh.get("protected"),
                        "remote HEAD changed or protected")
                  runs_for(name)
                  ref="refs/heads/"+name
                  lines=git("ls-remote","--heads","origin",ref).splitlines()
                  check(len(lines)==1 and lines[0].split()[0]==sha,
                        "compare-and-swap precondition failed")
                  git("push","--force-with-lease="+ref+":"+sha,
                      "origin","--delete",ref)
                  check(not git("ls-remote","--heads","origin",ref),
                        "deletion not confirmed")
                  deleted.append((name,sha,proof,method))
                  print("DELETED "+name+" at "+sha+" via "+method+
                        " verified "+proof,flush=True)
              except (RuntimeError,ValueError,KeyError,OSError) as err:
                  kept.append((name,str(err)))
                  print("RETAIN "+name+" : "+str(err),flush=True)
          print("SUMMARY merged_seen="+str(merged_seen)+
                " newly_merged="+str(newly_merged)+
                " historical_audited="+str(historical_seen)+
                " diverged_seen="+str(diverged_seen)+
                " descendant_proven="+str(descendant_proven)+
                " snapshot_proven="+str(snapshot_proven)+
                " deleted="+str(len(deleted))+
                " kept="+str(len(kept)),flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("## Audited pending branch cleanup\n\n")
              out.write("Dev "+dev+"; event "+before[:12]+".."+after[:12]+
                        "; merged "+str(merged_seen)+
                        " (new "+str(newly_merged)+")"+
                        "; divergent examined "+str(diverged_seen)+
                        "; descendant verified "+str(descendant_proven)+
                        "; snapshot verified "+str(snapshot_proven)+
                        "; deleted "+str(len(deleted))+
                        "; retained "+str(len(kept))+".\n\n")
              for name,sha,proof,method in deleted:
                  out.write("- Deleted "+name+" at "+sha+" via "+method+
                            "; verify "+proof+"\n")
              for name,why in kept:
                  out.write("- Retained "+name+": "+why+"\n")
          PY
