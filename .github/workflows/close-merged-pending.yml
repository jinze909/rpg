name: Close fully delivered pending branches

on:
  push:
    branches: [codex/dev]

permissions:
  contents: read

concurrency:
  group: close-verified-codex-pending
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'jinze909/rpg'
      && github.ref == 'refs/heads/codex/dev'
      && !github.event.forced
      && !github.event.created
      && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Audit ancestor and SHA-equivalent snapshots before safe deletion
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, time, urllib.parse, urllib.request
          REPO="jinze909/rpg"
          REF="refs/heads/codex/dev"
          SHARE=re.compile(r"^[0-9a-f]{40}$")
          PENDING=re.compile(r"^codex/pending/[A-Za-z0-9._/-]+$")
          TOKEN=os.environ["GH_TOKEN"]
          HEADERS={"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          
          def check(ok,reason):
              if not ok: raise RuntimeError("SAFETY STOP: "+reason)
          def git(*args):
              proc=subprocess.run(["git",*args],capture_output=True,text=True)
              check(proc.returncode==0,"git "+args[0]+": "+proc.stderr[-240:])
              return proc.stdout.strip()
          def ancestor(a,b):
              p=subprocess.run(["git","merge-base","--is-ancestor",a,b],capture_output=True,text=True)
              check(p.returncode in (0,1),"unknown ancestry: "+p.stderr[-240:])
              return p.returncode==0
          def have_commit(sha):
              # Actions retains metadata for SHAs on long-deleted branches.
              # A fetch of live refs correctly lacks those unreachable objects.
              # They cannot be ancestors of the fetched dev history.
              p=subprocess.run(["git","cat-file","-e",sha+"^{commit}"],
                               capture_output=True)
              return p.returncode==0
          def api(path):
              check(path.startswith("/repos/"+REPO+"/"),"invalid API route")
              q=urllib.request.Request("https://api.github.com"+path,headers=HEADERS)
              with urllib.request.urlopen(q,timeout=30) as response:
                  return json.load(response)
          def pages(path,key=None,limit=500):
              items=[]
              for n in range(1,limit//100+2):
                  sep="&" if "?" in path else "?"
                  response=api(path+sep+"per_page=100&page="+str(n))
                  batch=response[key] if key else response
                  check(isinstance(batch,list),"invalid API page")
                  items+=batch
                  check(len(items)<=limit,"API page limit reached")
                  if len(batch)<100:return items
              raise RuntimeError("API page limit exceeded")
          def runs_for(name):
              runs=pages("/repos/"+REPO+"/actions/runs?branch="+urllib.parse.quote(name,safe=""),
                         "workflow_runs")
              check(all(r.get("status")=="completed" for r in runs),"active or queued CI")
              return runs
          # The same-SHA artifact remains the acceptance criterion. For branch
          # retirement ONLY, a verified descendant may certify a failed/old
          # ancestor, and an exactly matching verified file snapshot may prove
          # that a divergent candidate was incorporated by a different SHA.
          VERIFIED_CACHE={}
          VERIFIED_ANCESTORS=None
          def verified_artifact(run,sha,runs):
              if not (SHARE.fullmatch(sha) and run.get("head_sha")==sha and
                      run.get("name")=="Unity ORK P0" and
                      run.get("status")=="completed" and
                      run.get("conclusion")=="success"):return None
              if any(x.get("head_sha")==sha and x.get("name")=="Unity ORK P0" and
                     x.get("created_at","")>run.get("created_at","") and
                     x.get("conclusion")!="success" for x in runs):return None
              key=(run["id"],run.get("run_attempt"),sha)
              if key not in VERIFIED_CACHE:
                  artifacts=pages("/repos/"+REPO+"/actions/runs/"+
                                  str(run["id"])+"/artifacts","artifacts",limit=200)
                  want="unity-ork-p0-verify-"+sha+"-attempt-"+str(run.get("run_attempt"))
                  VERIFIED_CACHE[key]=(run.get("html_url") if any(
                      a.get("name")==want and a.get("expired") is False and
                      a.get("size_in_bytes",0)>0 for a in artifacts) else None)
              return VERIFIED_CACHE[key]
          def verify_run(name,sha,runs):
              for run in runs:
                  proof=verified_artifact(run,sha,runs)
                  if proof:return proof
              return None
          def verified_ancestors():
              global VERIFIED_ANCESTORS
              if VERIFIED_ANCESTORS is None:
                  # One repository-wide read; no fresh CI or extra schedules.
                  all_runs=pages("/repos/"+REPO+"/actions/runs","workflow_runs",
                                 limit=2000)
                  valid=[r for r in all_runs
                         if r.get("name")=="Unity ORK P0" and
                         r.get("status")=="completed" and
                         r.get("conclusion")=="success" and
                         SHARE.fullmatch(r.get("head_sha") or "") and
                         have_commit(r["head_sha"]) and
                         ancestor(r["head_sha"],dev)]
                  VERIFIED_ANCESTORS=(all_runs,valid)
              return VERIFIED_ANCESTORS
          def descendant_proof(sha):
              all_runs,valid=verified_ancestors()
              for r in valid:
                  if not ancestor(sha,r["head_sha"]):continue
                  proof=verified_artifact(r,r["head_sha"],all_runs)
                  if proof:return proof
              return None
          def changed_paths_since_base(sha):
              base=git("merge-base",sha,dev)
              result=subprocess.run(["git","diff","--no-renames","--name-only","-z",base,sha],
                                    capture_output=True)
              check(result.returncode==0,"candidate diff failed")
              paths=[os.fsdecode(p) for p in result.stdout.split(b"\0") if p]
              # Large, ambiguous branch snapshots need a separate audit.
              check(len(paths)<=150,"candidate diff too broad for snapshot proof")
              return base,paths
          def same_changed_files(sha,verified_sha,paths):
              proc=subprocess.run(["git","diff","--quiet","--no-ext-diff",
                                   sha,verified_sha,"--",*paths],
                                  capture_output=True,text=True)
              check(proc.returncode in (0,1),"snapshot diff failed: "+proc.stderr[-240:])
              return proc.returncode==0
          def snapshot_proof(sha):
              check(time.monotonic()<snapshot_deadline,
                    "snapshot audit deferred: runtime budget")
              base,paths=changed_paths_since_base(sha)
              all_runs,valid=verified_ancestors()
              for r in valid:
                  check(time.monotonic()<snapshot_deadline,
                        "snapshot audit deferred: runtime budget")
                  verified_sha=r["head_sha"]
                  if not ancestor(base,verified_sha):continue
                  # ALL net changed files must be byte/mode identical in ONE
                  # actual verified dev-history commit; names alone are never proof.
                  if not same_changed_files(sha,verified_sha,paths):continue
                  proof=verified_artifact(r,verified_sha,all_runs)
                  if proof:return proof
              return None
          check(os.environ.get("GITHUB_REPOSITORY")==REPO,"wrong repository")
          check(os.environ.get("GITHUB_REF")==REF,"wrong branch")
          with open(os.environ["GITHUB_EVENT_PATH"],encoding="utf-8") as f:event=json.load(f)
          check(event.get("ref")==REF and event.get("forced") is False and
                event.get("created") is False and event.get("deleted") is False,
                "not an ordinary dev update")
          before,after=event.get("before"),event.get("after")
          check(isinstance(before,str) and isinstance(after,str) and
                SHARE.fullmatch(before) and SHARE.fullmatch(after) and
                before!="0"*40 and before!=after,"invalid push history")
          git("fetch","--no-tags","origin","+refs/heads/*:refs/remotes/origin/*")
          dev=api("/repos/"+REPO+"/git/ref/heads/codex/dev")["object"]["sha"]
          check(git("rev-parse","refs/remotes/origin/codex/dev")==dev,
                "dev changed while fetching")
          check(ancestor(before,after) and ancestor(after,dev),
                "force update, missing baseline, or stale event")
          pr_heads={p["head"]["ref"] for p in pages("/repos/"+REPO+"/pulls?state=open")}
          branches=pages("/repos/"+REPO+"/branches",limit=1000)
          # Sort by immutable ancestry first. Exhaustive divergent snapshot
          # comparison must never starve deletion of already merged heads.
          candidates=[]
          for branch in branches:
              name=branch.get("name","")
              sha=branch.get("commit",{}).get("sha","")
              if not PENDING.fullmatch(name):continue
              check(bool(SHARE.fullmatch(sha)),"bad candidate SHA")
              candidates.append((not ancestor(sha,dev),name,branch))
          candidates.sort(key=lambda item:(item[0],item[1]))
          snapshot_deadline=time.monotonic()+540
          # Explicit one-time retirements stay SHA-pinned. Ordinary merged
          # historical heads require their own exact-SHA verify evidence.
          ARCHIVED={
